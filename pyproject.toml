[project]
name = "spectrasynq-edgeai-lab"
version = "0.1.0"
description = "Experimental Edge-AI lab: SpectraSynq audio-semantic models targeting RA8P1 Ethos-U55"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary — SpectraSynq research. Third-party datasets retain their own licences." }
authors = [{ name = "SpectraSynq" }]
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
musdb = ["musdb>=0.4.0", "stempeg>=0.2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
edgeai-host-probe = "edgeai.smoke:host_probe_main"
edgeai-smoke = "edgeai.smoke:main"
edgeai-train = "edgeai.train:main"
edgeai-export = "edgeai.export:main"
edgeai-golden = "edgeai.golden:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
