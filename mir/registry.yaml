# SpectraSynq MIR asset registry — Amendment 001
# Licensing fields are independent. UNKNOWN is allowed. Not legal advice.
schema_version: 1
updated: 2026-08-30
entries:

  - id: librosa
    kind: library
    name: librosa
    version: ">=0.10"
    group: librosa development team
    source: https://github.com/librosa/librosa
    task: conventional MIR (STFT, onset, beat, chroma, RMS, centroid, flux)
    inputs: PCM
    outputs: frame-level descriptors
    temporal_resolution: hop-controlled (default ~23 ms @ 22 kHz)
    context: frame
    architecture: deterministic DSP
    params: n/a
    deployment: deterministic_host
    code_licence: ISC
    weight_licence: n/a
    dataset_licence: n/a
    research_use: yes
    commercial_use: yes
    teacher_use: n/a
    derived_weight_status: n/a
    attribution: required (copyright notice)
    redistribution: per ISC
    status: executed
    spectrasynq: "Baseline conventional MIR in the host oracle. Do not replace with NPU."

