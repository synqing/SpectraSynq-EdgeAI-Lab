    publication: arXiv 2306.00107; github.com/yizhilll/MERT (Apache-2.0 code)
    task: SSL music representation (RVQ-VAE + CQT teachers, MLM)
    inputs: 24 kHz mono
    outputs: hidden states 12×768; feature rate 75 Hz
    temporal_resolution: 75 Hz (~13 ms)
    context: 5 s pretrain
    architecture: HuBERT-like 12-layer transformer
    params: 95M
    deployment: unsuitable_mcu_npu
    code_licence: Apache-2.0 (training repo)
    weight_licence: CC BY-NC 4.0 (HF card)
    dataset_licence: 20k hours (not public dump)
    research_use: yes
    commercial_use: no
    teacher_use: research yes
    derived_weight_status: UNKNOWN/LEGAL REVIEW
    attribution: required
    redistribution: NC
    status: researched
    spectrasynq: "Best documented frame-rate music SSL teacher. Keep time axis. Do not mean-pool a track if we care about drops."

