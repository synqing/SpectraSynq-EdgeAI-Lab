  - id: essentia
    kind: library
    name: Essentia
    version: "2.1-beta6-dev (docs snapshot)"
    group: Music Technology Group, UPF
    source: https://essentia.upf.edu/
    publication: https://essentia.upf.edu/licensing_information.html
    task: DSP + MIR algorithms + TF inference wrappers
    inputs: audio
    outputs: large descriptor set + model embeddings
    temporal_resolution: algorithm-dependent; some realtime examples exist
    context: algorithm-dependent
    architecture: C++ / Python
    params: n/a
    deployment: host_oracle
    code_licence: AGPLv3 (commercial licence available from MTG)
    weight_licence: see essentia-models
    dataset_licence: n/a
    research_use: yes
    commercial_use: "AGPL copyleft or paid proprietary — not free-for-product by default"
    teacher_use: possible under AGPL constraints
    derived_weight_status: n/a
    attribution: required
    redistribution: AGPL
    status: researched
    spectrasynq: "Best conventional+ML host stack if we accept AGPL or buy a licence. Not silently embeddable."

  - id: essentia-models
    kind: model-family
    name: Essentia pretrained TF/ONNX models (MusiCNN, VGGish, Discogs-EffNet, MAEST, heads)
    version: "see essentia.upf.edu/models.html CHANGELOG"
    group: MTG / UPF
    source: https://essentia.upf.edu/models.html
    publication: Alonso-Jiménez et al., ICASSP 2020 (TF models in Essentia)
    task: embeddings + classification/regression heads (genre, instrument, mood, DEAM VA, Jamendo, …)
    inputs: 16 kHz mono typically
    outputs: embeddings and/or tag/VA vectors; some realtime examples
    temporal_resolution: patch/window; MusiCNN-class ~seconds; heads can ride embedding hop
    context: 1–30 s depending on extractor (MAEST 5–30 s)
    architecture: CNN (MusiCNN, EffNet) / Transformer (MAEST) + small 2D heads
    params: EffNet-B0 class; MAEST ONNX ~344 MB
    deployment: potential_teacher
    code_licence: AGPLv3 for library
    weight_licence: "CC BY-NC-SA 4.0 on models.html; licensing_information.html also states CC BY-NC-ND 4.0 — CONFLICT"
    dataset_licence: in-house Discogs20 / Jamendo / DEAM — mixed
    research_use: yes
    commercial_use: "proprietary licence upon request; do not assume CC-NC allows product"
    teacher_use: research yes; derived student UNKNOWN/LEGAL REVIEW
    derived_weight_status: UNKNOWN/LEGAL REVIEW
    attribution: required
    redistribution: NC-SA/ND conflict
    status: researched
    spectrasynq: "Primary host tagging/affect oracle family. Execute via Essentia TF when the env exists. Not Titan-direct (MAEST). EffNet+head is a teacher, not an NPU graph."

  - id: discogs-effnet
    kind: model
    name: discogs-effnet-bs64
    version: "1"
    group: MTG
    source: https://essentia.upf.edu/models/feature-extractors/discogs-effnet/
    publication: Alonso-Jiménez, Serra, Bogdanov, ISMIR 2022
    task: 400 Discogs style embedding + classification
    inputs: 16 kHz mono
    outputs: embeddings (penultimate dense+BN); style logits
    temporal_resolution: batched patches (official TF port is batch 64; ONNX dynamic-batch exists)
    context: short patches aggregated in time
    architecture: EfficientNet-B0 + embedding dense
    params: EfficientNet-B0 scale
    deployment: potential_teacher
    code_licence: Essentia AGPLv3
    weight_licence: CC BY-NC-SA 4.0 (models page)
    dataset_licence: Discogs20 in-house (editorial metadata)
    research_use: yes
    commercial_use: no (NC) unless MTG proprietary
    teacher_use: research yes
    derived_weight_status: UNKNOWN/LEGAL REVIEW
    attribution: required
    redistribution: NC-SA
    status: researched
    spectrasynq: "Smaller than MAEST. Better teacher size. Style embeddings may be too genre-global for lighting unless we keep the time axis."

  - id: maest
    kind: model
    name: MAEST (discogs-maest-*-pw)
    version: "2 (2025 ONNX refresh)"
    group: Pablo Alonso / MTG
    source: https://github.com/palonso/MAEST/
    publication: Alonso-Jiménez, Serra, Bogdanov, ISMIR 2023 (Efficient Supervised Training of Audio Transformers)
    task: Discogs style (400 or 519 labels) + embeddings
    inputs: 16 kHz; mel via TensorflowInputMusiCNN (torch inference uses torchaudio)
    outputs: logits + token embeddings (CLS/DIST + patches)
    temporal_resolution: 5 / 10 / 20 / 30 s variants; not frame-rate DSP
    context: 5–30 s (best downstream often 30s-pw)
    architecture: PaSST-family spectrogram transformer
    params: ~344 MB ONNX
    deployment: unsuitable_mcu_npu
    code_licence: check repo
    weight_licence: CC BY-NC-SA 4.0 (Replicate card + models page)
    dataset_licence: Discogs20 (~3.3M, 400 styles; 519l uses 4M)
    research_use: yes
    commercial_use: no unless proprietary
    teacher_use: research yes; 30 s context is slow for a lamp
    derived_weight_status: UNKNOWN/LEGAL REVIEW
    attribution: required
    redistribution: NC-SA
    status: researched
    spectrasynq: "Strong style oracle, weak realtime. Prefer 5s variant if we probe at all. Not a Titan model."

  - id: musicnn
    kind: model
    name: musicnn (MTT / MSD)
    version: 0.1.0
    group: Jordi Pons / MTG
    source: https://github.com/jordipons/musicnn
    publication: Pons & Serra, ISMIR LBD 2019; arXiv 1909.06654
    task: auto-tagging + taggram + intermediate features
    inputs: audio file; 3 s windows default
    outputs: tag probabilities over time (taggram); optional embeddings
    temporal_resolution: ~3 s hop (configurable overlap) — usable for lights if overlapped
    context: 3 s
    architecture: musically motivated CNN
    params: small (MTT) to bigger (MSD_musicnn_big)
    deployment: potential_embedded_student
    code_licence: ISC (LICENSE.md, UPF 2019)
    weight_licence: UNKNOWN (weights shipped in repo; trained on MTT/MSD — MSD is not a clean commercial audio grant)
    dataset_licence: MTT / MSD — MSD audio not freely redistributable
    research_use: yes
    commercial_use: UNKNOWN/LEGAL REVIEW (code ISC ≠ MSD audio)
    teacher_use: research yes
    derived_weight_status: UNKNOWN/LEGAL REVIEW
    attribution: required
    redistribution: ISC for code
    status: blocked
    spectrasynq: "Right output shape (taggram). Blocked here: TF1 + numpy<1.17. Prefer Essentia msd-musicnn.pb on a TF env. Graph family is student-plausible."

  - id: mtg-jamendo
    kind: dataset
