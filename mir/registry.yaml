  - id: htdemucs
    kind: model
    name: Hybrid Transformer Demucs
    version: "htdemucs / htdemucs_ft / htdemucs_6s"
    group: Meta FAIR (Défossez, Rouard, Massa)
    source: https://github.com/facebookresearch/demucs
    publication: Rouard et al., ICASSP 2023 arXiv 2211.08553
    task: 4-stem (6-stem variant) waveform separation
    inputs: stereo mix
    outputs: drums, bass, other, vocals (+ guitar/piano)
    temporal_resolution: waveform; activity via envelope of stems
    context: 10 s training segments; full-track inference with chunking
    architecture: hybrid spectrogram/waveform U-Net + transformer bottleneck
    params: large (hundreds of MB)
    deployment: host_oracle
    code_licence: MIT (repo LICENSE, Meta)
    weight_licence: "UNKNOWN — not MIT. Maintainer 2022-05-23 (#327): weights not covered by MIT, scientific purposes only. Conservative: research-only."
    dataset_licence: MUSDB-HQ + 800 extra songs (internal)
    research_use: yes (weights if we accept scientific-use statement)
    commercial_use: no (per maintainer statement)
    teacher_use: research yes
    derived_weight_status: UNKNOWN/LEGAL REVIEW
    attribution: required
    redistribution: weights unclear
    status: researched
    spectrasynq: "Best practical host separator-as-teacher. Do not put on Titan. Do not treat PyPI MIT as a weights grant."

