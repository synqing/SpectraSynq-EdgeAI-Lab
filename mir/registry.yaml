    architecture: n/a
    params: n/a
    deployment: potential_teacher
    code_licence: n/a
    weight_licence: n/a
    dataset_licence: "CC audio sources (FMA/Jamendo/MedleyDB); pages list BY-NC and mixed — UNKNOWN commercial"
    research_use: yes
    commercial_use: UNKNOWN
