    version: "1.0"
    group: MTG / UPF
    source: https://mtg.github.io/mtg-jamendo-dataset/
    publication: Bogdanov et al., ICML ML4MD 2019
    task: auto-tagging (genre 87, instrument 40, mood/theme 56 in splits)
    inputs: full tracks 320 kbps MP3
    outputs: uploader tags
    temporal_resolution: track-level labels (not 2 Hz)
    context: full song
    architecture: n/a
    params: n/a
    deployment: host_oracle
    code_licence: metadata repo CC BY-NC-SA 4.0 (GitHub README)
    weight_licence: n/a
    dataset_licence: "audio from Jamendo CC mix (some NC); metadata NC-SA — treat commercial as mixed/UNKNOWN"
    research_use: yes
    commercial_use: UNKNOWN (per-track CC)
    teacher_use: labels yes for research
    derived_weight_status: n/a
    attribution: required
    redistribution: per-track
    status: researched
    spectrasynq: "Best public ontology for energetic/dark/relaxing/dream. Labels are song-level — weak for drops. Use with sliding-window model outputs, not as frame GT."

  - id: deam
